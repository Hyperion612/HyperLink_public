<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>HyperLink - Redirecting...</title>
    <script type="text/javascript">
      // Simple redirect for HashRouter SPA on GitHub Pages
      // Redirect all 404s to index.html with the path as hash
      var pathSegmentsToKeep = 0;
      
      var l = window.location;
      var path = l.pathname.split('/').slice(pathSegmentsToKeep).join('/');
      
      // Redirect to index.html with the path as hash
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') +
        '#/' + path.slice(1) +
        l.search +
        l.hash
      );
    </script>
  </head>
  <body>
    <div style="display: flex; align-items: center; justify-content: center; height: 100vh; color: white; font-family: sans-serif; background: #000;">
      <div style="text-align: center;">
        <div style="font-size: 24px; margin-bottom: 10px;">HyperLink</div>
        <div style="color: #666; font-size: 14px;">Перенаправление...</div>
      </div>
    </div>
  </body>
</html>
